[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-local"
version = "1.0.0"
description = "Standalone local AI assistant for Windows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0,<7.0",
  "httpx>=0.27,<1.0",
  "vosk>=0.3.45,<0.4",
  "sounddevice>=0.4.7,<1.0",
  "soundfile>=0.12.1,<1.0",
  "numpy>=1.26,<2.0",
  "sentence-transformers>=2.7,<4.0",
  "faiss-cpu>=1.8,<2.0",
  "pypdf>=4.0,<6.0",
  "opencv-python-headless>=4.9,<5.0",
  "edge-tts>=7.0,<8.0",
  "pyttsx3>=2.90,<3.0",
  "pywin32>=306,<311",
  "langchain-core>=0.3,<2.0",
  "langchain>=0.3,<2.0",
  "rich>=13.7,<15.0",
  "psutil>=5.9,<8.0",
]

[project.scripts]
jarvis-local = "src.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
